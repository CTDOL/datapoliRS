services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: datapoli_postgres
    restart: "no"
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-datapoli_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-datapoli_pass}
      POSTGRES_DB: ${POSTGRES_DB:-datapoli_db}
    volumes:
      - datapolirs_postgres_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-datapoli_user} -d ${POSTGRES_DB:-datapoli_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datapoli_network

  redis:
    image: redis:7-alpine
    container_name: datapoli_redis
    restart: "no"
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - datapolirs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datapoli_network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: datapoli_api
    restart: "no"
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./app:/app/app
      - ./etl:/app/etl
      - ./sql:/app/sql
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - PORT=8000
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER:-datapoli_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-datapoli_pass}
      - POSTGRES_DB=${POSTGRES_DB:-datapoli_db}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-datapoli_user}:${POSTGRES_PASSWORD:-datapoli_pass}@postgres:5432/${POSTGRES_DB:-datapoli_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - datapoli_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: dev
    container_name: datapoli_frontend
    restart: "no"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./frontend:/app
      - datapolirs_frontend_node_data:/app/node_modules
      - datapolirs_frontend_next_data:/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
    depends_on:
      - api
    networks:
      - datapoli_network

volumes:
  datapolirs_postgres_data:
  datapolirs_redis_data:
  datapolirs_frontend_node_data:
  datapolirs_frontend_next_data:

networks:
  datapoli_network:
    driver: bridge
