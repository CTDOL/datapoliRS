name: Deploy Produção

# Esteira em dois fluxos (ADR 043).
#  - Fluxo 1, dev -> hml: push direto para hml, sem testes e sem deploy. hml é o espelho local (make hml-up).
#    Este workflow não roda nada para hml.
#  - Fluxo 2, hml -> main -> produção: PR para main roda testes e o E2E de fumaça (check e2e).
#    workflow_dispatch na main, com a versão SemVer (vX.Y.Z) de uma Release existente: validar-versao ->
#    testes -> build das imagens -> deploy na VPS OCI (environment producao). Nenhum evento de Release dispara deploy.
#    O disparo é sempre manual (Regra 7.4 do cofre: nada de push, merge ou Release acionando produção).
#    Na carga inicial, popula o banco (municípios + uma carga).
#  - push em dev e main: só testes, nunca build nem deploy.

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      versao:
        description: 'Versão SemVer da Release, no formato vX.Y.Z (ex: v0.2.0)'
        required: true
        type: string
      carga_tipo:
        description: 'Carga a enfileirar depois do deploy (none = só redeploy)'
        required: true
        default: 'none'
        type: choice
        options: [ none, votacao, comparecimento ]
      carga_ano:
        description: 'Ano do pleito da carga (ex: 2022)'
        required: false
        default: '2022'
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-producao
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: datapoli_user
          POSTGRES_PASSWORD: datapoli_pass
          POSTGRES_DB: datapoli_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapoli_user -d datapoli_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://datapoli_user:datapoli_pass@localhost:5432/datapoli_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-for-production
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: operador@campanha.com.br
      ADMIN_PASSWORD: admin123
      ADMIN_TENANT_ID: 11111111-2222-3333-4444-555555555555
      ENVIRONMENT: test
      # Os testes importam o pacote etl, que fica na raiz e não no backend/.
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # Banco vazio até o head: valida a cadeia completa de migrations do zero (doutrina de migrations).
      - name: Aplicar Migrations (Alembic, do zero)
        run: alembic upgrade head

      - name: Executar Testes com Pytest
        run: pytest -v --asyncio-mode=auto

  test-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gerar Tipos de Rotas (Next.js)
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes Unitários (Vitest)
        run: npm run test

      # Erro de build tem que parar o PR para hml, e não só o job de build da main.
      - name: Build (Next.js)
        run: npm run build

  # E2E de fumaça contra uma API real (login, Mapa Tático, Lideranças, Emendas, Projetos de Lei).
  # Só roda em PR para main: é o gate da promoção hml -> main. Push para hml não passa por aqui (Fluxo 1, sem testes).
  e2e:
    needs: [test-backend, test-frontend]
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: imresamu/postgis:16-3.4
        env:
          POSTGRES_USER: datapoli_user
          POSTGRES_PASSWORD: datapoli_pass
          POSTGRES_DB: datapoli_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapoli_user -d datapoli_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://datapoli_user:datapoli_pass@localhost:5432/datapoli_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-for-production
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      ADMIN_EMAIL: operador@campanha.com.br
      ADMIN_PASSWORD: admin123
      ADMIN_TENANT_ID: 11111111-2222-3333-4444-555555555555
      ENVIRONMENT: test
      # O rewrite /api do Next (frontend/next.config.ts) encaminha para esta API: sem NEXT_PUBLIC_API_URL,
      # o navegador do teste fala same-origin, como no dev local.
      API_INTERNAL_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Configurar Python (API para o E2E)
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar Dependências do Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar Migrations (Alembic, do zero)
        working-directory: backend
        run: alembic upgrade head

      - name: Subir API em background (uvicorn)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "API não respondeu a tempo:"
          cat "$RUNNER_TEMP/api.log"
          exit 1

      - name: Configurar Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright (Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testes E2E de Fumaça (Playwright)
        working-directory: frontend
        run: npx playwright test

  validar-versao:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'

    permissions:
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}
      VERSAO: ${{ inputs.versao }}

    steps:
      - name: Checkout com tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validar formato, Release e commit
        run: |
          if [[ ! "$VERSAO" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Versão inválida: '$VERSAO'. Esperado vX.Y.Z." >&2
            exit 1
          fi
          if ! gh release view "$VERSAO" --json isDraft --jq '.isDraft == false' | grep -q true; then
            echo "A Release '$VERSAO' não existe ou ainda é rascunho." >&2
            exit 1
          fi
          if [ "$(git rev-parse "$VERSAO^{commit}")" != "${{ github.sha }}" ]; then
            echo "A tag '$VERSAO' não aponta para o commit construído (${{ github.sha }})." >&2
            exit 1
          fi

  build:
    needs: [test-backend, test-frontend, validar-versao]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: ghcr.io/ctdol/datapolirs-api
            context: ./backend
            dockerfile: backend/Dockerfile
            target: ""
            buildArgs: ""
          - image: ghcr.io/ctdol/datapolirs-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            target: production
            # Assado no bundle (NEXT_PUBLIC_* só existe em build-time). Produção: sem selo de ambiente.
            buildArgs: NEXT_PUBLIC_PORTAL_URL=https://api-datapoli.ctdol.com.br
          - image: ghcr.io/ctdol/datapolirs-etl
            context: .
            dockerfile: etl/Dockerfile
            target: ""
            buildArgs: ""

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      # A VPS OCI é Ampere A1 (ARM64). O runner é x86_64: sem QEMU o build arm64 não roda.
      - name: Configurar QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push (linux/arm64, tags = SHA do commit e versão)
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:${{ github.sha }}
            ${{ matrix.image }}:${{ inputs.versao }}
          build-args: ${{ matrix.buildArgs }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    needs: [build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Required reviewer (environment producao): o job aguarda aprovação humana antes de tocar a VPS.
    environment: producao

    permissions:
      contents: read
      packages: read

    env:
      RELEASE_TAG: ${{ inputs.versao }}
      # VPS_DEPLOY_PATH é variável do environment (não secret). Sem ela, o scp grava em "/".
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/datapolirs' }}
      VPS: ${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}
      CARGA_TIPO: ${{ inputs.carga_tipo || 'none' }}
      CARGA_ANO: ${{ inputs.carga_ano || '2022' }}
      PUBLIC_API_URL: https://api-datapoli.ctdol.com.br/health
      PUBLIC_APP_URL: https://datapoli.ctdol.com.br/

    steps:
      - name: Checkout Código
        uses: actions/checkout@v7

      - name: Validar entradas do deploy
        run: |
          if [[ ! "$CARGA_TIPO" =~ ^(none|votacao|comparecimento)$ ]]; then
            echo "Carga inválida: '$CARGA_TIPO'." >&2
            exit 1
          fi
          if [ "$CARGA_TIPO" != "none" ] && [[ ! "$CARGA_ANO" =~ ^(19|20)[0-9]{2}$ ]]; then
            echo "Ano inválido: '$CARGA_ANO'. Esperado AAAA (ex: 2022)." >&2
            exit 1
          fi

      - name: Configurar chave SSH e known_hosts
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

      # Só o compose de produção vai para a VPS. O .env de produção (segredos reais) fica na VPS e nunca sai dela.
      - name: Sincronizar docker-compose.prod.yml
        run: |
          scp -i ~/.ssh/vps_deploy_key docker-compose.prod.yml "$VPS:$VPS_DEPLOY_PATH/docker-compose.prod.yml"

      - name: Login no GHCR na VPS (token efêmero via stdin)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/vps_deploy_key "$VPS" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull + up (imagens do SHA deste commit)
        run: |
          ssh -i ~/.ssh/vps_deploy_key "$VPS" bash -s -- "$VPS_DEPLOY_PATH" "$RELEASE_TAG" <<'REMOTO'
          set -e
          cd "$1"
          export RELEASE_TAG="$2"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"
          $COMPOSE pull
          # Migrações antes da troca da API: o banco sobe sem recriar a API atual, e o alembic roda
          # num container descartável. Se a migração falhar, o set -e aborta e a API anterior segue no ar.
          $COMPOSE up -d postgres redis
          $COMPOSE run --rm --no-deps api alembic upgrade head
          $COMPOSE up -d
          REMOTO

      - name: Health check dos serviços na VPS
        run: |
          ssh -i ~/.ssh/vps_deploy_key "$VPS" bash -s -- "$VPS_DEPLOY_PATH" "$RELEASE_TAG" <<'REMOTO'
          set -e
          cd "$1"
          export RELEASE_TAG="$2"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"
          total=$($COMPOSE config --services | wc -l)
          for i in $(seq 1 30); do
            running=$($COMPOSE ps --status running --services | wc -l)
            if [ "$running" -eq "$total" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Nem todos os serviços subiram ($running/$total esperados):"
          $COMPOSE logs --tail=100
          exit 1
          REMOTO

      # Carga inicial (só com carga_tipo != none): municípios primeiro, depois a carga na fila do worker.
      # Ambos são idempotentes no que toca o banco; a carga é enfileirada, o worker a executa em seguida.
      - name: Popular banco (carga inicial)
        if: env.CARGA_TIPO != 'none'
        run: |
          ssh -i ~/.ssh/vps_deploy_key "$VPS" bash -s -- "$VPS_DEPLOY_PATH" "$RELEASE_TAG" "$CARGA_TIPO" "$CARGA_ANO" <<'REMOTO'
          set -e
          cd "$1"
          export RELEASE_TAG="$2"
          COMPOSE="docker compose -f docker-compose.prod.yml --env-file .env"
          $COMPOSE run --rm --no-deps etl-worker python -m etl.import_municipios_geojson
          $COMPOSE run --rm --no-deps etl-worker python -m etl.enfileirar_carga "$3" "$4"
          REMOTO

      - name: Health check público (através do gateway e da Cloudflare)
        run: |
          for url in "$PUBLIC_API_URL" "$PUBLIC_APP_URL"; do
            ok=false
            for _ in $(seq 1 20); do
              if curl -sf "$url" > /dev/null; then
                echo "OK: $url"
                ok=true
                break
              fi
              sleep 6
            done
            if [ "$ok" != true ]; then
              echo "Falha no health check público: $url" >&2
              exit 1
            fi
          done

      - name: Logout do GHCR na VPS (sempre)
        if: always()
        run: |
          ssh -i ~/.ssh/vps_deploy_key "$VPS" "docker logout ghcr.io" || true

      - name: Remover chave SSH do runner (sempre)
        if: always()
        run: rm -f ~/.ssh/vps_deploy_key
