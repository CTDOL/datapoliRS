name: CI Pipeline

on:
  push:
    branches: [ dev, hml, main ]
  pull_request:
    branches: [ dev, hml, main ]
  release:
    types: [ published ]

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: datapoli_user
          POSTGRES_PASSWORD: datapoli_pass
          POSTGRES_DB: datapoli_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapoli_user -d datapoli_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://datapoli_user:datapoli_pass@localhost:5432/datapoli_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-for-production
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: operador@campanha.com.br
      ADMIN_PASSWORD: admin123
      ADMIN_TENANT_ID: 11111111-2222-3333-4444-555555555555
      ENVIRONMENT: test

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar Migrations (Alembic)
        run: |
          alembic upgrade head

      - name: Executar Testes com Pytest
        run: |
          pytest -v --asyncio-mode=auto

  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: datapoli_user
          POSTGRES_PASSWORD: datapoli_pass
          POSTGRES_DB: datapoli_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapoli_user -d datapoli_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Os testes E2E fazem login de verdade — precisam de uma API real
      # respondendo em 127.0.0.1:8000. NEXT_PUBLIC_API_URL fica de fora de
      # propósito: sem ela, o axios usa baseURL relativa e o rewrite do
      # Next.js (next.config.ts) encaminha same-origin para a API — o mesmo
      # caminho usado em dev local, que elimina o mismatch de cookie entre
      # "localhost" e "127.0.0.1" (ver nota no playwright.config.ts).
      DATABASE_URL: postgresql://datapoli_user:datapoli_pass@localhost:5432/datapoli_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-for-production
      ALLOWED_ORIGINS: http://127.0.0.1:3000
      ADMIN_EMAIL: operador@campanha.com.br
      ADMIN_PASSWORD: admin123
      ADMIN_TENANT_ID: 11111111-2222-3333-4444-555555555555
      ENVIRONMENT: test

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python (API para os testes E2E)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Instalar Dependências do Backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar Migrations (Alembic)
        working-directory: backend
        run: alembic upgrade head

      - name: Subir API em background (uvicorn)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 2
          done
          echo "API não respondeu a tempo:"
          cat backend.log
          exit 1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Gerar Tipos de Rotas (Next.js)
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Testes Unitários (Vitest)
        run: npm run test

      - name: Instalar Playwright (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E de Fumaça (Playwright)
        run: npx playwright test

  # HML é efêmero: nunca hospedado, existe só para o tempo deste job. Sobe a
  # stack de PRODUÇÃO completa (mesmo docker-compose.prod.yml, com Nginx real
  # na frente) dentro do próprio runner e dispara o Playwright através do
  # proxy — o único lugar em que roteamento por subdomínio, CORS e o
  # compartilhamento do cookie de sessão entre app.*/api.* (proxy_cookie_domain)
  # são de fato exercitados. A suíte "frontend" acima roda em loopback puro e
  # estruturalmente não consegue ver essa classe de bug (ADR 022/024).
  #
  # Débito conhecido e documentado (não bloqueador): este job roda tudo em
  # HTTP simples (ENVIRONMENT=hml, cookie sem Secure=true) — TLS real via
  # Certbot só existe na VPS de produção, fora do escopo desta sessão.
  e2e-parity:
    needs: [test, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/hml'
    runs-on: ubuntu-latest

    env:
      RELEASE_TAG: ci-${{ github.sha }}
      APP_DOMAIN: datapoli.local
      API_DOMAIN: api.datapoli.local

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build imagem da API (local, sem push ao GHCR)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          load: true
          tags: ghcr.io/ctdol/datapolirs-api:${{ env.RELEASE_TAG }}
          cache-from: type=gha,scope=e2e-api
          cache-to: type=gha,mode=max,scope=e2e-api

      - name: Build imagem do Frontend (local, sem push ao GHCR)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: frontend/Dockerfile
          target: production
          load: true
          tags: ghcr.io/ctdol/datapolirs-frontend:${{ env.RELEASE_TAG }}
          # Selo visual de ambiente (ADR universal governanca/047): identifica
          # para quem testar que esta é a stack de paridade hml, não produção.
          build-args: NEXT_PUBLIC_ENV_LABEL=HOMOLOGACAO
          cache-from: type=gha,scope=e2e-frontend
          cache-to: type=gha,mode=max,scope=e2e-frontend

      - name: Registrar domínios de paridade em /etc/hosts
        run: echo "127.0.0.1 ${{ env.APP_DOMAIN }} ${{ env.API_DOMAIN }}" | sudo tee -a /etc/hosts

      - name: Preparar .env.prod efêmero (segredos só de CI, nunca reais)
        run: |
          cat > .env.prod <<EOF
          RELEASE_TAG=${{ env.RELEASE_TAG }}
          APP_DOMAIN=${{ env.APP_DOMAIN }}
          API_DOMAIN=${{ env.API_DOMAIN }}
          APP_PROTOCOL=http
          API_PROTOCOL=http
          ENVIRONMENT=hml
          POSTGRES_USER=datapoli_user
          POSTGRES_PASSWORD=ci-only-pass
          POSTGRES_DB=datapoli_db
          SECRET_KEY=ci-only-secret-not-for-production
          ADMIN_EMAIL=operador@campanha.com.br
          ADMIN_PASSWORD=admin123
          ADMIN_TENANT_ID=11111111-2222-3333-4444-555555555555
          EOF

      - name: Subir stack de produção completa (efêmera, com Nginx)
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

      - name: Esperar stack ficar saudável atrás do proxy
        run: |
          for i in $(seq 1 30); do
            curl -sf "http://${{ env.APP_DOMAIN }}/" > /dev/null && \
            curl -sf "http://${{ env.API_DOMAIN }}/health" > /dev/null && exit 0
            sleep 3
          done
          echo "Stack de paridade não respondeu a tempo:"
          docker compose -f docker-compose.prod.yml logs
          exit 1

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar Dependências do Frontend
        working-directory: frontend
        run: npm ci

      - name: Instalar Playwright (Chromium)
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Testes E2E de Paridade (através do Nginx real, não loopback)
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://${{ env.APP_DOMAIN }}
        run: npx playwright test

      - name: Derrubar stack efêmera (sempre — HML nunca fica hospedado)
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.prod down -v

  docker-publish:
    needs: [test, frontend]
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'release'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - image: ghcr.io/ctdol/datapolirs-api
            context: ./backend
            dockerfile: backend/Dockerfile
            target: ""
            buildArgs: ""
          - image: ghcr.io/ctdol/datapolirs-frontend
            context: ./frontend
            dockerfile: frontend/Dockerfile
            target: production
            # Link externo pro portal público (ADR_026_datapolirs) — URL real,
            # não secreta, assada no bundle porque NEXT_PUBLIC_* só existe em
            # build-time. NEXT_PUBLIC_ENV_LABEL fica de fora de propósito:
            # produção real não mostra selo de ambiente.
            buildArgs: NEXT_PUBLIC_PORTAL_URL=https://api-datapoli.ctdol.com.br

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      # Runner é x86_64; sem binfmt registrado via QEMU, a etapa linux/arm64
      # do build multi-arquitetura falha ou cai num caminho de emulação lento
      # e não confiável — a VPS Oracle é Ampere A1/ARM64 de verdade.
      - name: Configurar QEMU (emulação ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login no GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da Imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,format=long,enable=${{ github.event_name == 'push' }}
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}

      - name: Build e Push (multi-arquitetura — VPS Oracle é Ampere A1/ARM64)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ matrix.buildArgs }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # Gatilho ÚNICO de produção: Release publicada (nunca push direto em main).
  # `environment: producao` exige a configuração manual, no GitHub (Settings →
  # Environments) de required reviewers e dos secrets VPS_SSH_HOST/
  # VPS_SSH_USER/VPS_SSH_KEY — nenhum existe ainda, e é vedado ao Claude Code
  # criá-los ou aprovar o environment (Regra 1.1): sem eles, este job falha
  # nos passos de SSH, o que é o comportamento correto até a configuração
  # humana ser feita.
  deploy:
    needs: [docker-publish]
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: producao

    # Só leitura: o GITHUB_TOKEN efêmero deste job precisa apenas puxar as
    # imagens já publicadas pelo docker-publish (que usou permissions mais
    # amplas para publicá-las) — nunca escrever no registry a partir daqui.
    permissions:
      contents: read
      packages: read

    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
      VPS_DEPLOY_PATH: ${{ vars.VPS_DEPLOY_PATH || '/opt/datapolirs' }}

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar chave SSH e known_hosts (sem StrictHostKeyChecking=no)
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_deploy_key
          chmod 600 ~/.ssh/vps_deploy_key
          ssh-keyscan -H "${{ secrets.VPS_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Sincronizar manifestos (compose + Nginx) — nunca o .env.prod real
        run: |
          ssh -i ~/.ssh/vps_deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "mkdir -p '${{ env.VPS_DEPLOY_PATH }}/nginx/templates'"
          scp -i ~/.ssh/vps_deploy_key docker-compose.prod.yml \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:${{ env.VPS_DEPLOY_PATH }}/docker-compose.prod.yml"
          scp -i ~/.ssh/vps_deploy_key nginx/templates/default.conf.template \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}:${{ env.VPS_DEPLOY_PATH }}/nginx/templates/default.conf.template"
          # .env.prod NUNCA é copiado daqui: guarda os segredos reais de produção
          # e é mantido à mão na VPS (fora do alcance deste pipeline).

      - name: Login no GHCR na VPS (token efêmero via stdin, nunca em ps/arquivo)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | ssh -i ~/.ssh/vps_deploy_key \
            "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "docker login ghcr.io -u '${{ github.actor }}' --password-stdin"

      - name: Pull + up (imagem taggeada pela Release, nunca :latest)
        run: |
          ssh -i ~/.ssh/vps_deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            bash -s -- "${{ env.VPS_DEPLOY_PATH }}" "${{ env.RELEASE_TAG }}" <<'REMOTO'
          set -e
          cd "$1"
          export RELEASE_TAG="$2"
          docker compose -f docker-compose.prod.yml --env-file .env.prod pull
          docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
          REMOTO

      - name: Health check pós-deploy (sem depender de curl dentro das imagens)
        run: |
          ssh -i ~/.ssh/vps_deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            bash -s -- "${{ env.VPS_DEPLOY_PATH }}" <<'REMOTO'
          set -e
          cd "$1"
          total=$(docker compose -f docker-compose.prod.yml config --services | wc -l)
          for i in $(seq 1 30); do
            running=$(docker compose -f docker-compose.prod.yml ps --status running --services | wc -l)
            if [ "$running" -eq "$total" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "Nem todos os serviços subiram ($running/$total esperados):"
          docker compose -f docker-compose.prod.yml logs --tail=100
          exit 1
          REMOTO

      - name: Logout do GHCR na VPS (sempre, mesmo em falha)
        if: always()
        run: |
          ssh -i ~/.ssh/vps_deploy_key "${{ secrets.VPS_SSH_USER }}@${{ secrets.VPS_SSH_HOST }}" \
            "docker logout ghcr.io" || true

      - name: Remover chave SSH do runner (sempre)
        if: always()
        run: rm -f ~/.ssh/vps_deploy_key
