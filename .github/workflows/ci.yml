name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: datapoli_user
          POSTGRES_PASSWORD: datapoli_pass
          POSTGRES_DB: datapoli_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U datapoli_user -d datapoli_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://datapoli_user:datapoli_pass@localhost:5432/datapoli_db
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-only-secret-not-for-production
      ALLOWED_ORIGINS: http://localhost:3000
      ADMIN_EMAIL: operador@campanha.com.br
      ADMIN_PASSWORD: admin123
      ADMIN_TENANT_ID: 11111111-2222-3333-4444-555555555555
      ENVIRONMENT: test

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar Schema do Banco
        run: |
          PGPASSWORD=datapoli_pass psql -h localhost -U datapoli_user -d datapoli_db -f sql/01_init_schema.sql

      - name: Executar Testes com Pytest
        run: |
          pytest -v --asyncio-mode=auto
