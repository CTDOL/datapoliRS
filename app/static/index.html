<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de Candidatas - RS</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
    <div class="container">
        <header>
            <h1>Busca de Candidatas <span>RS</span></h1>
            <p>Pesquise deputadas estaduais do Rio Grande do Sul e veja detalhes e bens declarados.</p>
        </header>

        <main>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Digite o nome da candidata..." autocomplete="off">
                <button id="searchBtn">Buscar</button>
            </div>

            <div id="loader" class="loader hidden"></div>
            
            <div id="errorMessage" class="error-message hidden"></div>

            <div id="resultContainer" class="result-container hidden">
                <div class="profile-card">
                    <div class="profile-header">
                        <div class="profile-image">
                            <img id="candidatePhoto" src="" alt="Foto da Candidata">
                        </div>
                        <div class="profile-info">
                            <h2 id="candidateUrnaName">Nome de Urna</h2>
                            <p class="full-name" id="candidateFullName">Nome Completo</p>
                            <div class="tags">
                                <span class="tag tag-party" id="candidateParty">Partido</span>
                                <span class="tag tag-number" id="candidateNumber">00000</span>
                                <span class="tag tag-status" id="candidateStatus">Situação</span>
                            </div>
                        </div>
                    </div>
                </div>



                <!-- Map Card -->
                <div class="card fade-in" id="mapCard">
                    <h3>Votação por Município</h3>
                    <div id="map" style="height: 400px; width: 100%; border-radius: 8px; margin-top: 1rem;"></div>
                </div>
            </div>
        </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Custom Script -->
    <script src="/static/script.js"></script>
</body>
</html>
